name: Download badge
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-badge
jobs:
  badge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count main.js downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/download-badge.mjs "$RUNNER_TEMP/downloads.json"

      - name: Publish to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch origin badges
            git checkout -f -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/downloads.json" downloads.json
          git add downloads.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "Download count unchanged"
            exit 0
          fi
          git commit -m "Update download count"
          git push origin badges
